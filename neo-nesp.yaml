spi:
  ### SPI bus for display initialization
  clk_pin:
    number: 12
    allow_other_uses: true
  mosi_pin:
    number: 13
    allow_other_uses: true

display:
  ### VIEWESMART UEDX48480021-MD80ET Display
  # Using pre-configured model but overriding PCLK inversion
  - platform: mipi_rgb
    model: UEDX48480021-MD80ET
    id: screen
    pclk_inverted: false  # Override: research shows this should be FALSE not TRUE
    auto_clear_enabled: false
    update_interval: never
    lambda: |-
      // White background with red square
      it.fill(Color(255, 255, 255));
      it.filled_rectangle(90, 90, 300, 300, Color(255, 0, 0));

