      #     condition: lvgl.is_paused
      #     then:
      #       - lvgl.resume:
      #       - lvgl.widget.redraw:
      #       - delay: 1s
      #       - lvgl.pause:
      - light.turn_on: backlight
      # - script.execute: idle_screen_timer

time:
  - platform: homeassistant
    id: hass_time
    on_time:
      - seconds: 0
        then:
          # - script.execute: update_menu_date_label
          # - script.execute: update_boost_timer_label
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

