substitutions:
  friendly_name: 'NESP'
  hostname: 'neo-nesp'
  device_name: 'neo_nesp'
  device_description: 'VIEWESMART UEDX48480021-MD80ET 2.1" 480x480 touch + rotary display'

  # Home Assistant entities you want to control with nESP
  climate_entity: climate.house_heating
  heating_timetoday: sensor.heating_on_today
  boost_input_boolean: input_boolean.heating_boost
  boost_timer_entity: timer.heating_boost_timer

  # Home Assistant weather/info entities
  weather_entity: weather.met_office_tyn_y_rhos_hall
  weather_icon_entity: sensor.tyn_y_rhos_hall_weather_3_hourly
  weather_feels_like_entity: sensor.bom_melbourne_temp_feels_like
  weather_high_entity: sensor.today_max
  weather_low_entity: sensor.lowtemp
  weather_rain_chance_entity: sensor.today_rain

esphome:
  name: ${hostname}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  comment: ${device_description}
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    - light.turn_on:
        id: backlight
        brightness: 0.7
    - delay: 2s  # Allow display driver to stabilize
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
psram:
  mode: octal
  speed: 80MHz

debug:
  update_interval: 60s

<<: !include _common.yaml

output:
  ### DISPLAY BACKLIGHT
  - platform: ledc
    id: display_led
    pin: 7  # VIEWESMART display backlight
    zero_means_zero: true

light:
  - platform: monochromatic
    id: backlight
    output: display_led
    name: Backlight
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON

  ### RGB RING LIGHT
  - platform: esp32_rmt_led_strip
    name: RGB LED
    id: rgb_ring
    pin: 4
    num_leds: 13
    #rmt_channel: 0
    rgb_order: GRB
    chipset: WS2812

switch:
