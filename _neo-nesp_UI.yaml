globals:
  - id: active_lvgl_page
    type: std::string

lvgl:
  encoders:
    enter_button: push_button
    sensor: rotary
  bg_color: black
  scrollbar_mode: "OFF"
  default_font: roboto_reg
  text_color: white
  style_definitions:
    - id: style_menu_button
      align: CENTER
      bg_opa: TRANSP
      shadow_opa: TRANSP
      height: 50
      width: 50
      radius: 50%
    - id: style_menu_button_label
      align: CENTER
      y: 3
      text_font: roboto_med

  pages:
    ### GUI - THERMOSTAT
    - id: main_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"main_page"'
      widgets:
        - arc:
            id: arc_bg
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
        - arc:
            id: current_temp_arc
            adjustable: true
            state:
              disabled: true
            min_value: 120    # 12°C (* 10 because decimals not supported)
            max_value: 240    # 24°C
            height: 468
            width: 468
            align: CENTER
            arc_color: graylight
            arc_opa: COVER
            arc_width: 2
            arc_rounded: false
            indicator:
              arc_color: graylight
              arc_opa: COVER
              arc_width: 2
              arc_rounded: false
            knob:
              bg_color: white
            value: 230
        - meter:
            id: meter_ticks
            height: 480
            width: 480
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: 120   # 12°C (* 10 because decimals not supported)
              range_to: 240     # 24°C
              ticks:
                count: 48
                length: 37
                width: 3
                color: graylight
              indicators:
                - line:
                    id: set_temp_needle
                    color: white
                    width: 8
                    r_mod: 10
                    value: 230
                - arc:
                    id: diff_temp_arc
                    start_value: 120
                    end_value: 230
                    color: white
                    width: 2
                    r_mod: 10
        - obj:
            id: mode_bg
            height: 350
            width: 350
            radius: 175
            align: CENTER
            border_width: 0
            bg_color: black
        - roller:
            id: set_temp_roller
            state:
              disabled: true
            align: CENTER
            anim_time: 500ms
            text_font: roboto_med
            text_opa: TRANSP
            bg_opa: TRANSP
            border_width: 0
            text_line_space: 30
            visible_row_count: 2
            selected:
              text_font: roboto_huge
              text_opa: COVER
              bg_opa: TRANSP
              border_width: 0
            options:
              - 16.0
              - 16.5
              - 17.0
              - 17.5
              - 18.0
              - 18.5
              - 19.0 
              - 19.5
              - 20.0
              - 20.5
              - 21.0
              - 21.5
              - 22.0
              - 22.5
              - 23.0
              - 23.5
              - 24.0
              - 24.5
              - 25.0
              - 25.5
              - 26.0
              - 26.5
              - 27.0
              - 27.5
              - 28.0
              - 28.5
              - 29.0
              - 29.5
              - 30.0
            selected_index: 14
        - label:
            id: celsius_label
            align: CENTER
            x: 100
            y: -43
            text: "°C"
        - label:
            id: mode_label
            align: CENTER
            y: -100
            text: "NESP"
        - label:
            id: weather_icon_label
            hidden: true
            align: CENTER
            y: -100
            text_font: roboto_huge
            text: " "
        - label:
            id: weather_temp_label
            hidden: true
            align: CENTER
            text_font: roboto_huge
            text: " "
        - label:
            id: weather_forecast_label
            hidden: true
            align: CENTER
            y: 70 
            text: "forecast"
        - label:
            id: weather_feels_like_label
            hidden: true
            align: CENTER
            y: 130
            text: " "
        - label:
            id: boost_timer_label                # moved: now placed before current_temp_label
            align: CENTER
            y: 70
            text_font: roboto_reg
            text_color: red
            text: ""                             # default empty when no timer
        - label:
            id: current_temp_label
            align: CENTER
            y: 120
            text: " "

    ### GUI - MENU
    - id: menu_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"menu_page"'
        - script.execute: update_menu_date_label
        - lvgl.widget.enable:
            - menu_back_button
            - menu_power_button
            - menu_mode_button
            - menu_preset_button
        - lvgl.widget.focus: menu_power_button
      on_unload:
        - lvgl.widget.disable:
            - menu_back_button
            - menu_power_button
            - menu_mode_button
            - menu_preset_button
      widgets:
        - label:
            id: menu_date_label
            align: LEFT_MID
            x: 30
            y: -80
            text_align: LEFT
            text_color: graydark
            text: "SUN 00:00"
        - label:
            id: menu_weather_icon_label
            align: LEFT_MID
            x: 30
            y: -47
            text_align: LEFT
            text: "\U000F0599"
        - label:
            id: menu_weather_label
            align: LEFT_MID
            x: 60
            y: -50
            text_align: LEFT
            text: "00°C"
        # - label:
        #     id: menu_indoor_label
        #     align: LEFT_MID
        #     x: 30
        #     y: -10
        #     text_align: LEFT
        #     text_color: graydark
        #     text: "INDOOR"
        - label:
            id: menu_heatingtime_label
            align: LEFT_MID
            x: 30
            y: 80
            text_align: LEFT
            text_color: graydark
            text: "Heating Today"
        - label:
            id: menu_heatingtime_value_label
            align: LEFT_MID
            x: 30
            y: 110
            text_align: LEFT
            text: "00H 00M"
        - label:
            id: selected_menu_label
            align: CENTER
            x: 55
            text_font: roboto_med
            text_align: RIGHT
        - button:
            id: menu_back_button
            state:
              disabled: true
            x: 182
            y: -105
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Back"
            on_press:
              - script.execute: goto_main_page
        - button:
            id: menu_power_button
            state:
              disabled: true
            x: 210
            y: 0
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F0425"
            on_focus:
              - if:
                  condition:
                    lambda: 'return strcmp(id(hvac_mode).state.c_str(), "off") == 0;'
                  then:
                    lvgl.label.update:
                      id: selected_menu_label
                      text: "Turn On"
                  else:
                    lvgl.label.update:
                      id: selected_menu_label
                      text: "Turn Off"
            on_press:
              - homeassistant.action:
                  action: climate.toggle
                  data:
                    entity_id: ${climate_entity}
              - script.execute: goto_main_page
        - button:
            id: menu_mode_button
            state:
              disabled: true
            x: 182
            y: 105
            styles: style_menu_button
            widgets:
              - label:
                  id: menu_mode_button_label
                  styles: style_menu_button_label
                  text: "\U000F0238"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Mode"
            on_press:
              - script.execute: goto_mode_page
        - button:
            id: menu_preset_button
            state:
              disabled: true
            x: 105
            y: 182
            styles: style_menu_button
            widgets:
              - label:
                  id: menu_preset_button_label
                  styles: style_menu_button_label
                  text: "\U000F032A"
            on_focus:
              - lvgl.label.update:
                  id: selected_menu_label
                  text: "Presets"
            on_press:
              - script.execute: goto_preset_page

    ### GUI - MODE SELECT
    - id: mode_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"mode_page"'
        - lvgl.widget.enable:
            - mode_back_button
            - mode_heat_button
        - lvgl.widget.focus: mode_heat_button
      on_unload:
        - lvgl.widget.disable:
            - mode_back_button
            - mode_heat_button
      widgets:
        - label:
            id: selected_mode_label
            align: CENTER
            x: 55
            text_font: roboto_med
            text_align: RIGHT
        - button:
            id: mode_back_button
            state:
              disabled: true
            x: 105    # 210sin(30) clock coords
            y: -182   # 210cos(30)
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lvgl.label.update:
                  id: selected_mode_label
                  text: "Back"
            on_press:
              - script.execute: goto_menu_page
        - button:
            id: mode_heat_button
            state:
              disabled: true
            x: 182
            y: 105
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F0238"
            on_focus:
              - lvgl.label.update:
                  id: selected_mode_label
                  text: "Heat"
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "heat"
              - script.execute: goto_main_page

    ### GUI - PRESET SELECT
    - id: preset_page
      on_load:
        - globals.set:
            id: active_lvgl_page
            value: '"preset_page"'
        - lvgl.widget.enable:
            - preset_back_button
            - preset_eco_button
            - preset_comfort_button
            - preset_boost_button
        - lvgl.widget.focus: preset_eco_button
      on_unload:
        - lvgl.widget.disable:
            - preset_back_button
            - preset_eco_button
            - preset_comfort_button
            - preset_boost_button
      widgets:
        - label:
            id: selected_preset_label
            align: CENTER
            x: 55
            text_font: roboto_med
            text_align: RIGHT
        - button:
            id: preset_back_button
            state:
              disabled: true
            x: 182
            y: -105
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F004D"
            on_focus:
              - lvgl.label.update:
                  id: selected_preset_label
                  text: "Back"
            on_press:
              - script.execute: goto_menu_page
        - button:
            id: preset_eco_button
            state:
              disabled: true
            x: 210
            y: 0
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F032A"
            on_focus:
              - lvgl.label.update:
                  id: selected_preset_label
                  text: "Eco"
            on_press:
              - if:
                  condition:
                    lambda: 'return strcmp(id(preset_mode).state.c_str(), "eco") == 0;'
                  then:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: ${climate_entity}
                          preset_mode: "none"
                  else:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: ${climate_entity}
                          preset_mode: "eco"
              - script.execute: goto_main_page
        - button:
            id: preset_comfort_button
            state:
              disabled: true
            x: 182
            y: 105
            styles: style_menu_button
            widgets:
              - label:
                  styles: style_menu_button_label
                  text: "\U000F04B9"
            on_focus:
              - lvgl.label.update:
                  id: selected_preset_label
                  text: "Comfort"
            on_press:
              - if:
                  condition:
                    lambda: 'return strcmp(id(preset_mode).state.c_str(), "comfort") == 0;'
                  then:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: ${climate_entity}
                          preset_mode: "none"
                  else:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: ${climate_entity}
                          preset_mode: "comfort"
              - script.execute: goto_main_page
        - button:
            id: preset_boost_button
            state:
              disabled: true
            x: 105
            y: 182
            styles: style_menu_button
            widgets:
              - label:
                  id: preset_boost_button_label     # <-- added id so we can target the icon color
                  styles: style_menu_button_label
                  text: "\U000F14DE"
            on_focus:
              - lvgl.label.update:
                  id: selected_preset_label
                  text: "Boost"
            on_press:
              # Toggle the HA input_boolean; subscription will update the UI color.
              - homeassistant.service:
                  service: input_boolean.toggle
                  data:
                    entity_id: ${boost_input_boolean}
              - script.execute: update_boost_timer_label
              - script.execute: goto_main_page

script:
  ### VIBRATION MOTOR SCRIPT (disabled - no vibration motor on VIEWESMART)
  # - id: vibrate
  #   parameters:
  #     length_ms: int
  #   then:
  #     # XXX doesn't delay properly for short lengths (10-100ms)
  #     - switch.turn_on: vibration
  #     - delay: !lambda return length_ms;
  #     - switch.turn_off: vibration
  
  # Idle screen timeout: turn off backlight after 10 minutes of inactivity
  - id: idle_screen_timer
    then:
      - delay: 10min
      - logger.log: "Idle timeout expired: turning off backlight"
      - light.turn_off: backlight
      - lvgl.pause:
          show_snow: true
  # navigate to pages with animation
  - id: goto_main_page
    then:
      - lvgl.page.show:
          id: main_page
          animation: FADE_OUT
          time: 500ms
  - id: goto_menu_page
    then:
      - lvgl.page.show:
          id: menu_page
          animation: FADE_IN
          time: 500ms
  - id: goto_mode_page
    then:
      - lvgl.page.show:
          id: mode_page
          animation: FADE_IN
          time: 500ms
  - id: goto_preset_page
    then:
      - lvgl.page.show:
          id: preset_page
          animation: FADE_IN
          time: 500ms

  # hvac mode UI scripts
  - id: update_menu_date_label
    then:
      - lvgl.label.update:
          id: menu_date_label
          text: !lambda |-
            auto now = id(hass_time).now();
            static const char * const day_names[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
            static char buf[10];
            snprintf(buf, sizeof(buf), "%s %02d:%02d", day_names[now.day_of_week-1], now.hour, now.minute);
            return buf;
  - id: set_mode_off
    then:
      - script.execute: hide_widgets
      - lvgl.label.update:
          id: mode_label
          text: "OFF"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: black
      - light.turn_off: rgb_ring
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: white
          text: "\U000F0717"
      - lvgl.widget.update:
          id: menu_power_button
          text_color: graydark
      - lvgl.widget.update:
          id: mode_heat_button
          text_color: white
  - id: set_mode_heat
    then:
      - script.execute: show_widgets
      - lvgl.label.update:
          id: mode_label
          text: "HEAT TO"
      - lvgl.widget.update:
          id: mode_bg
          bg_color: mode_heat
      - light.turn_on:
          id: rgb_ring
          brightness: 100%
          red:   1.000
          green: 0.533
          blue:  0.118
      - lvgl.label.update:
          id: menu_mode_button_label
          text_color: mode_heat
          text: "\U000F0238"
      - lvgl.widget.update:
          id: menu_power_button
          text_color: white
      - lvgl.widget.update:
          id: mode_heat_button
