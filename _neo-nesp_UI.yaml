  - id: update_boost_timer_label
    then:
      - lvgl.label.update:
          id: boost_timer_label
          text: !lambda |-
            // read finishes_at directly from the HA-backed sensor state
            std::string s = id(boost_timer_finishes_at).state;
            if (s.size() < 19) return std::string(""); // no timer -> empty

            int Y=0, Mo=0, D=0, h=0, m=0, sec=0;
            std::string dtpart = s.substr(0, 19); // "YYYY-MM-DDTHH:MM:SS"
            if (sscanf(dtpart.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &Mo, &D, &h, &m, &sec) != 6) return std::string("");

            // parse explicit timezone offset in finishes_at (seconds), default 0 for 'Z' or absent
            int tz_offset_seconds = 0;
            size_t tzpos = std::string::npos;
            for (size_t i = 19; i < s.size(); ++i) {
              if (s[i] == 'Z' || s[i] == '+' || s[i] == '-') { tzpos = i; break; }
            }
            if (tzpos != std::string::npos) {
              char tz = s[tzpos];
              if (tz == 'Z') {
                tz_offset_seconds = 0;
              } else if (tz == '+' || tz == '-') {
                int oh = 0, om = 0;
                if (sscanf(s.c_str() + tzpos + 1, "%d:%d", &oh, &om) == 2) {
                  tz_offset_seconds = oh * 3600 + om * 60;
                  if (tz == '-') tz_offset_seconds = -tz_offset_seconds;
                }
              }
            }

            // days_from_civil -> days since 1970-01-01
            auto days_from_civil = [](int y, int mo, int d) -> long long {
              y -= mo <= 2;
              const long long era = (y >= 0 ? y : y - 399) / 400;
              const unsigned yoe = static_cast<unsigned>(y - era * 400);      // [0, 399]
              const unsigned doy = (153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5 + d - 1; // [0, 365]
              const unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;     // [0, 146096]
              return era * 146097 + static_cast<long long>(doe) - 719468;
            };

            long long finish_days = days_from_civil(Y, Mo, D);
            long long dt_seconds = finish_days * 86400LL + (long long)h * 3600LL + (long long)m * 60LL + (long long)sec;
            long long finish_utc = dt_seconds - (long long)tz_offset_seconds;

            // HA "now" fields
            auto now = id(hass_time).now();
            long long now_days = days_from_civil(now.year, now.month, now.day_of_month);
            long long now_local_epoch = now_days * 86400LL + (long long)now.hour * 3600LL + (long long)now.minute * 60LL + (long long)now.second;

            // Try candidate offsets (-12h .. +14h) in 15-minute steps and pick one where finish_utc is in the future
            const long long MAX_FUTURE = 7LL * 86400LL; // accept finishes within 7 days
            bool found = false;
            long long chosen_offset = 0;
            for (int off_min = -12 * 60; off_min <= 14 * 60; off_min += 15) {
              long long off_secs = (long long)off_min * 60LL;
              long long now_utc_candidate = now_local_epoch - off_secs;
              long long diff_candidate = finish_utc - now_utc_candidate;
              if (diff_candidate > 0 && diff_candidate < MAX_FUTURE) {
                chosen_offset = off_secs;
                found = true;
                break;
              }
            }
            if (!found) return std::string(""); // couldn't infer => hide

            long long now_utc = now_local_epoch - chosen_offset;
            long long diff = finish_utc - now_utc;
            if (diff <= 0) return std::string("");

            int mins = static_cast<int>((diff + 59) / 60); // round up
            char buf[32];
            snprintf(buf, sizeof(buf), "Boosting for %d min", mins);
            return std::string(buf);